<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <meta name="google-site-verification" content="EH68myzmbZ32ld5UQOAL-tWi52c5FHLitCEQHpWF4Y8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" media="print" onload="this.media='all'" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/homeo.webp" fetchpriority="high" type="image/webp" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/dmed.webp" fetchpriority="high" type="image/webp" />

    <!--
      Site-wide entity markup for answer engines (Google AI Overviews,
      Bing Copilot, ChatGPT/Perplexity browsing, etc.) so DecentMed is
      recognized as a distinct organization independent of any one page.
      Page-specific structured data (e.g. FAQPage on /faq) is added per
      page via react-helmet.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalBusiness",
        "name": "DecentMed",
        "url": "https://decentmed.org",
        "logo": "https://decentmed.org/logo192.png",
        "description": "DecentMed is a holistic medicine information portal that connects patients with vetted holistic health providers - including acupuncture, naturopathy, chiropractic, functional medicine, energy healing, and more - via telehealth.",
        "sameAs": [
          "https://www.linkedin.com/company/themerlingroupworld/",
          "https://www.youtube.com/@DCNTMD"
        ]
      }
    </script>

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
          <!-- Google tag (gtag.js) delayed for performance -->
    <script>
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-5G7V3TDXCN';
          document.head.appendChild(script);

          window.dataLayer = window.dataLayer || [];
          window.gtag = function(){window.dataLayer.push(arguments);}
          window.gtag('js', new Date());
          window.gtag('config', 'G-5G7V3TDXCN');
        }, 1500);
      });
    </script>
    <title>React App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      Hidden static form so Netlify's build-time bot can detect and register
      the "summit-signup" form (Netlify only scans plain HTML at build time,
      not forms rendered by React at runtime). The real, interactive version
      of this form lives in src/info/SummitForm.js and submits to this same
      form name via fetch(). Do not remove or rename fields here without
      updating SummitForm.js to match.
    -->
    <form name="summit-signup" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
